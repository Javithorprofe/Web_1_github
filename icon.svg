<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!-- Background -->
  <rect width="192" height="192" rx="38" fill="#ffffff"/>

  <!-- Top red bar -->
  <rect x="0" y="0" width="192" height="54" rx="38" fill="#e8a4b8"/>
  <rect x="0" y="28" width="192" height="26" fill="#e8a4b8"/>

  <!-- Calendar rings -->
  <rect x="54" y="8" width="12" height="28" rx="6" fill="white"/>
  <rect x="126" y="8" width="12" height="28" rx="6" fill="white"/>

  <!-- Month text -->
